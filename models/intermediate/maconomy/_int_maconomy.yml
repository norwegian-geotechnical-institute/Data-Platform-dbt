version: 2

models:
  - name: int_job_entry_invoice_line
    description: |
      Unified job entry + job invoice line fact stream, recreating Maconomy
      EXJobEntryJobInvoiceLinePV from base bronze tables. source_marker 1 =
      JobEntry, 2 = JobInvoiceLine.
    columns:
      - name: source_marker
        description: "Row origin: 1 = JobEntry, 2 = JobInvoiceLine."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2]
      - name: instance_key
        description: "Maconomy INSTANCEKEY for the source row."
        tests:
          - not_null
      - name: job_number
        description: "Job number for the entry or invoice line."
      - name: billing_price_reg_base
        description: "Primary billing amount in base currency for P&L measures."

  - name: int_hours_project
    description: |
      Job entries — typed and projected for hours and cost measures.
      Carries drilldown identifiers (job_id, transaction_number) so a
      Power BI drillthrough can resolve back to the source entry.
    columns:
      - name: job_id
        description: "Job number cast to int. Drilldown identifier."
      - name: job_number
        description: |
          Job number as a trimmed string, exactly as Maconomy stores it. Prefer
          this over job_id for any join back to JOBHEADER or a task list:
          job_id is try_cast(job_number as int) and is therefore NULL for the
          N-suffixed job numbers used by company 20 (e.g. '20250160N').
      - name: task_name
        description: "Task code/name from JOBENTRY.TASKNAME. Trimmed to match TASKLISTLINE.TASKNAME."
      - name: transaction_number
        description: "Transaction identifier (typed int)."
      - name: activity_id
        description: "Activity number (typed int). Primary filter for hours measures."
      - name: entry_date
        description: "Entry date (typed date). Month context for measures."
      - name: finance_entry_date
        description: "Date used for nedskrivninger measures."
      - name: number_registered_qty
        description: "Quantity registered — typically hours."
      - name: billing_price_reg_base_amt
        description: "Registered billing price in base currency. Used for revenue measures."
      - name: billing_price_up_down_base_amt
        description: "Billing price up/down adjustment. Filter for nedskrivninger."
      - name: cost_price_amt
        description: "Cost price for the entry."
      - name: sub_department_id
        description: "Sub-department identifier (typed int). Foreign key to int_department.sub_department_id."
      - name: supplier_id
        description: "Supplier/vendor identifier (typed int). Used to exclude internal supplier 29999 from external-party revenue."
      - name: cost_price_reg_amt
        description: "Registered cost price (COSTPRICEREG). Cost basis for the hours cost P&L lines; matches the legacy report's Kostpris."

  - name: int_finance_project
    description: |
      Finance entries — typed and projected for the P&L revenue and cost measures.
      Carries transaction_number for drilldown back to the source posting.
    columns:
      - name: transaction_number
        description: "Transaction identifier (typed int). Drilldown identifier."
      - name: account_id
        description: "Account number (typed int). Primary filter for P&L measures."
        tests:
          - not_null
      - name: activity_id
        description: "Activity number (typed int)."
      - name: entry_date
        description: "Entry date (typed date). Month context for measures."
        tests:
          - not_null
      - name: posting_date
        description: "Posting date (typed date)."
      - name: sub_department_id
        description: "Sub-department identifier (typed int). Foreign key to int_department.sub_department_id."
      - name: entity_id
        description: "Entity identifier (typed int). Used to derive the production-unit P&L category for account 7000; not a reporting dimension."
      - name: debit_base_amt
        description: "Debit amount in base currency."
      - name: credit_base_amt
        description: "Credit amount in base currency."

  - name: int_account
    description: "Account dimension — typed projection of staging account."
    columns:
      - name: account_id
        description: "Account number (typed int). Business key."
        tests:
          - not_null
          - unique
      - name: account_name
        description: "Account text/description."

  - name: int_activity
    description: "Activity dimension — typed projection of staging activity."
    columns:
      - name: activity_id
        description: "Activity number (typed int). Business key."
        tests:
          - not_null
          - unique
      - name: activity_name
        description: "Activity text/description."

  - name: int_department
    description: |
      Department dimension — sourced from Maconomy location. Provides the
      hierarchy omrade → department → sub-department.
    columns:
      - name: sub_department_id
        description: "Sub-department identifier (typed int). Business key from Maconomy location name."
        tests:
          - not_null
          - unique
      - name: sub_department_name
        description: "Sub-department description. From Maconomy location description."
      - name: department_id
        description: "Department identifier (typed int). From Maconomy entity name."
      - name: omrade_id
        description: "Område (area) identifier (typed int). Derived from Maconomy specification slot 2, rounded down to the nearest 10."