version: 2

models:
  - name: stg_maconomy_department
    description: |
      Department dimension staged from Maconomy ENTITY. NGI uses Maconomy's
      ENTITY concept to represent departments; specification slot 3 holds
      the department number, and statistic slots 1 and 2 hold the
      area (område) number and name.
    columns:
      - name: department_row_id
        description: "Internal numeric row identifier from Maconomy."
      - name: department_instance_key
        description: "Stable row identifier from Maconomy. Unique key for incremental loads."
        tests:
          - not_null
          - unique
      - name: department_name
        description: "Maconomy entity name; functions as the business key for the department."
        tests:
          - not_null
      - name: department_description
        description: "Human-readable department label."
      - name: is_blocked
        description: "Whether the department is blocked from new postings."
      - name: location_name
        description: "Linked location (joins to maconomy.location)."
      - name: departmentnr
        description: "Department number (sourced from Maconomy specification slot 3)."
      - name: omradenr
        description: "Area number (sourced from Maconomy statistic slot 1)."
      - name: omradename
        description: "Area display name (sourced from Maconomy statistic slot 2)."
      - name: source_transaction_timestamp
        description: "Watermark from the source system — last modification time."
        tests:
          - not_null
      - name: ingested_at
        description: "Timestamp when bronze ingest landed this row."
      - name: ingestion_run_id
        description: "Bronze run identifier; lets you trace which ingest run produced this row."
      - name: source_system
        description: "Source system identifier (always 'maconomy' for this model)."
      - name: source_object
        description: "Source object identifier (always 'entity' for this model)."

  - name: stg_maconomy_account
    description: "Standardized staging view over bronze Maconomy account data."
    columns:
      - name: account_instance_key
        description: "Stable row identifier from Maconomy. Unique key for incremental loads."
        tests:
          - not_null
          - unique
      - name: account_number
        description: "Account number; the business key for the account."
        tests:
          - not_null
      - name: source_transaction_timestamp
        description: "Watermark from the source system — last modification time."
        tests:
          - not_null

  - name: stg_maconomy_activity
    description: "Standardized staging view over bronze Maconomy activity data."
    columns:
      - name: activity_instance_key
        description: "Stable row identifier from Maconomy. Unique key for incremental loads."
        tests:
          - not_null
          - unique
      - name: activity_number
        description: "Activity number; the business key for the activity."
        tests:
          - not_null
          - unique
      - name: source_transaction_timestamp
        description: "Watermark from the source system — last modification time."
        tests:
          - not_null

  - name: stg_maconomy_finance_project
    description: "Standardized staging view over bronze Maconomy finance entry data (financeentry)."
    columns:
      - name: transaction_number
        description: "Transaction identifier; multiple finance entries can share a transaction."
        tests:
          - not_null
      - name: account_number
        description: "Account this entry posts to."
        tests:
          - not_null
      - name: activity_number
        description: "Activity this entry is associated with."
      - name: entry_date
        description: "Date the entry was registered (raw string, format yyyy.MM.dd)."
      - name: posting_date
        description: "Date the entry was posted to the ledger (raw string, format yyyy.MM.dd)."
      - name: location_name
        description: "Linked location for the entry."
      - name: entity_name
        description: "Linked entity (department) for the entry."
      - name: entry_text
        description: "Free-text description from the source."
      - name: debit_base
        description: "Debit amount in base currency."
      - name: credit_base
        description: "Credit amount in base currency."
      - name: ingested_at
        description: "Timestamp when bronze ingest landed this row."
      - name: ingestion_run_id
        description: "Bronze run identifier; lets you trace which ingest run produced this row."
      - name: source_system
        description: "Source system identifier (always 'maconomy' for this model)."
      - name: source_object
        description: "Source object identifier (always 'financeentry' for this model)."

  - name: stg_maconomy_hours_project
    description: |
      Standardized staging view over bronze Maconomy job entry data (jobentry).
      Filters ENTRYNUMBER >= 0 and zeroes write-up/down and quantity when invoiced.
    columns:
      - name: job_entry_row_id
        description: "Internal numeric row identifier from Maconomy."
      - name: job_entry_instance_key
        description: "Stable row identifier from Maconomy. Unique key for incremental loads."
        tests:
          - not_null
          - unique
      - name: entry_number
        description: "Entry number within the job."
        tests:
          - not_null
      - name: job_number
        description: "Job this entry belongs to."
        tests:
          - not_null
      - name: journal_number
        description: "Journal number for the entry."
      - name: journal_line_number
        description: "Line number within the journal."
      - name: transaction_number
        description: "Transaction identifier; multiple job entries can share a transaction."
      - name: transaction_type
        description: "Maconomy transaction type."
      - name: posting_date
        description: "Date the entry was posted (raw string, format yyyy.MM.dd)."
        tests:
          - not_null
      - name: entry_date
        description: "Date the entry was registered (raw string, format yyyy.MM.dd)."
      - name: finance_entry_date
        description: "Date the entry hit finance (raw string, format yyyy.MM.dd)."
      - name: company_number
        description: "Company the entry belongs to."
      - name: activity_number
        description: "Activity this entry is associated with."
      - name: activity_text
        description: "Activity description text."
      - name: entry_text
        description: "Free-text description from the source."
      - name: employee_number
        description: "Employee who registered the entry."
      - name: number_registered
        description: "Hours quantity registered on the entry."
      - name: cost_price
        description: "Cost price for the registered hours."
      - name: original_cost_price
        description: "Original cost price before any adjustment."
      - name: markup_percentage
        description: "Markup percentage applied."
      - name: billing_price_reg_base
        description: "Registered billing price in base currency."
      - name: billing_price_up_down_base
        description: |
          Billing price write-up/write-down in base currency. Zeroed when the entry
          has been invoiced (non-blank invoice_number), matching Maconomy PV logic.
      - name: invoice_number
        description: "Invoice the entry was billed on, if any."
      - name: location_name
        description: "Linked location for the entry."
      - name: entity_name
        description: "Linked entity (department) for the entry."
      - name: project_name
        description: "Project name for the entry."
      - name: source_transaction_timestamp
        description: "Watermark from the source system — last modification time."
        tests:
          - not_null
      - name: ingested_at
        description: "Timestamp when bronze ingest landed this row."
      - name: ingestion_run_id
        description: "Bronze run identifier; lets you trace which ingest run produced this row."
      - name: source_system
        description: "Source system identifier (always 'maconomy' for this model)."
      - name: source_object
        description: "Source object identifier (always 'jobentry' for this model)."

  - name: stg_maconomy_jobinvoiceline
    description: |
      Standardized staging view over bronze Maconomy job invoice line data.
      Source for the invoice-side rows in int_job_entry_invoice_line.
      DEBITCREDIT = 1 negates cost and billing-total columns only; write-up/down
      is passed through unchanged, matching Maconomy PV logic.
    columns:
      - name: debit_credit
        description: "Maconomy DEBITCREDIT flag. When 1, cost and billing-total amounts are negated."
      - name: job_invoice_line_instance_key
        description: "Stable row identifier from Maconomy. Unique key for incremental loads."
        tests:
          - not_null
          - unique
      - name: job_number
        description: "Job this invoice line belongs to."
        tests:
          - not_null
      - name: source_transaction_timestamp
        description: "Watermark from the source system — last modification time."
        tests:
          - not_null

  - name: stg_maconomy_location
    description: "Standardized staging view over bronze Maconomy location data."
    columns:
      - name: location_instance_key
        description: "Stable row identifier from Maconomy. Unique key for incremental loads."
        tests:
          - not_null
          - unique
      - name: location_name
        description: "Location name; the business key for the location."
        tests:
          - not_null
          - unique
      - name: source_transaction_timestamp
        description: "Watermark from the source system — last modification time."
        tests:
          - not_null