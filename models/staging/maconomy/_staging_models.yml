version: 2

models:
  - name: stg_maconomy_entity
    description: "Standardized staging view over bronze Maconomy entity data."
    columns:
      - name: instance_key
        tests:
          - not_null
          - unique
      - name: entity_name
        tests:
          - not_null
      - name: transaction_timestamp
        tests:
          - not_null

  - name: stg_maconomy_jobentry
    description: "Minimal standardized staging view over bronze Maconomy job entry data."
    columns:
      - name: instance_key
        tests:
          - not_null
          - unique
      - name: transaction_timestamp
        tests:
          - not_null
