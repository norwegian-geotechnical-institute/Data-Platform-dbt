name: dbt build (prod)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: dbt-build-prod
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dbt
        run: pip install dbt-databricks

      - name: dbt deps
        run: dbt deps
        working-directory: ./   # adjust if project isn't at repo root

      - name: dbt build
        run: dbt build --target prod
        working-directory: ./
        env:
          DBT_DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DBT_DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
          DBT_DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DBT_DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
          DBT_DATABRICKS_SILVER_CATALOG: dp_silver
          DBT_DATABRICKS_GOLD_CATALOG: dp_gold