# yaml-language-server: $schema=
name: data_platform
version: 1.0.0
config-version: 2

profile: data_platform

flags:
  partial_parse: true

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  data_platform:
    staging:
      +catalog: "{{ env_var('DBT_DATABRICKS_SILVER_CATALOG', 'dp_silver') }}"
      +schema: stg
      +materialized: view
    intermediate:
      +catalog: "{{ env_var('DBT_DATABRICKS_SILVER_CATALOG', 'dp_silver') }}"
      +schema: int
      +materialized: view
    marts:
      +catalog: "{{ env_var('DBT_DATABRICKS_GOLD_CATALOG', 'dp_gold') }}"
      +schema: dm
      +materialized: table
